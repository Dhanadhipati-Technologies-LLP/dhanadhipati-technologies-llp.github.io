<!DOCTYPE html>
<html>
<head>
  <title>Ludo Wordo — Join via Referral</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .container { max-width: 400px; }
    h1 { color: #f5c518; font-size: 2em; }
    p  { color: #cccccc; }
    .btn {
      display: none;
      margin: 10px;
      padding: 14px 28px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
    }
    .android { background: #34a853; color: white; }
    .ios { background: #007aff; color: white; }
  </style>
</head>

<body>
<div class="container">
  <h1>🎲 Ludo Wordo</h1>
  <p id="status">Redirecting...</p>

  <a id="androidBtn" class="btn android">Get on Android</a>
  <a id="iosBtn" class="btn ios">Get on iPhone</a>
</div>

<script>
  // ───────── CONFIG ─────────
  var packageName = "com.dhanadhipatitechnologiesllp.ludowordo";
  var iosAppId    = "YOUR_IOS_APP_ID"; // replace later
  var scheme      = "ludowordo://referral?code=";

  // ───────── GET CODE ─────────
  var params = new URLSearchParams(window.location.search);
  var code   = params.get("code") || "";

  // ───────── URLS ─────────
  var playStoreUrl =
    "https://play.google.com/store/apps/details?id=" + packageName +
    (code ? "&referrer=code%3D" + encodeURIComponent(code) : "");

  var appStoreUrl =
    "https://apps.apple.com/app/id" + iosAppId;

  var deepLink =
    scheme + encodeURIComponent(code);

  // ───────── DEVICE DETECTION ─────────
  var ua = navigator.userAgent.toLowerCase();
  var isAndroid = /android/.test(ua);
  var isIOS = /iphone|ipad|ipod/.test(ua);

  // ───────── ANDROID FLOW ─────────
  if (isAndroid) {
    document.getElementById("status").textContent =
      "Redirecting to Google Play...";

    // IMPORTANT: direct replace (no timeout)
    window.location.replace(playStoreUrl);
  }

  // ───────── iOS FLOW ─────────
  else if (isIOS) {
    document.getElementById("status").textContent =
      "Opening app...";

    // Try opening app
    window.location.href = deepLink;

    // Fallback to App Store
    setTimeout(function () {
      window.location.href = appStoreUrl;
    }, 1500);
  }

  // ───────── DESKTOP / OTHER ─────────
  else {
    document.getElementById("status").textContent =
      "Choose your platform";

    var androidBtn = document.getElementById("androidBtn");
    var iosBtn     = document.getElementById("iosBtn");

    androidBtn.href = playStoreUrl;
    iosBtn.href     = appStoreUrl;

    androidBtn.style.display = "inline-block";
    iosBtn.style.display     = "inline-block";
  }
</script>
</body>
</html>
